services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    image: autumn27/artex:${ARTEX_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      # emp3r0r cc sidecar（profile emp3r0r）。.env 设置启用后透传生效；
      # wg_* 凭据缺省时 artex 自动读下方挂载的 wg_config.json provisioning。
      ARTEX_EMP3R0R: ${ARTEX_EMP3R0R:-}
      ARTEX_EMP3R0R_ENDPOINT: ${ARTEX_EMP3R0R_ENDPOINT:-emp3r0r:${EMP3R0R_WG_PORT:-13377}}
      ARTEX_EMP3R0R_SERVER_KEY: ${ARTEX_EMP3R0R_SERVER_KEY:-}
      ARTEX_EMP3R0R_SERVER_IP: ${ARTEX_EMP3R0R_SERVER_IP:-}
      ARTEX_EMP3R0R_OPERATOR_IP: ${ARTEX_EMP3R0R_OPERATOR_IP:-}
      ARTEX_EMP3R0R_OPERATOR_KEY: ${ARTEX_EMP3R0R_OPERATOR_KEY:-}
      ARTEX_EMP3R0R_OPERATOR_PORT: ${ARTEX_EMP3R0R_OPERATOR_PORT:-}
      ARTEX_EMP3R0R_SESSION: ${ARTEX_EMP3R0R_SESSION:-}
      ARTEX_EMP3R0R_AGENT_BINARY: ${ARTEX_EMP3R0R_AGENT_BINARY:-}
      ARTEX_EMP3R0R_POLL_INTERVAL: ${ARTEX_EMP3R0R_POLL_INTERVAL:-}
      ARTEX_EMP3R0R_WAIT_SECONDS: ${ARTEX_EMP3R0R_WAIT_SECONDS:-}
      ARTEX_EMP3R0R_WG_CONFIG: ${ARTEX_EMP3R0R_WG_CONFIG:-/emp3r0r-workspace/wg_config.json}
      ARTEX_EMP3R0R_OPERATOR_NAME: ${ARTEX_EMP3R0R_OPERATOR_NAME:-artex}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
      # emp3r0r cc workspace 只读挂载：artex 读 wg_config.json 拿 WG 凭据
      # （server/operator 公钥私钥、WG IP），即 config.emp3r0r 的凭据来源。
      - ./data/emp3r0r:/emp3r0r-workspace:ro
      # deploy_emp3r0r 投递的 agent 二进制（本地构建/下载后放入该目录）。
      - ./data/emp3r0r-agent:/emp3r0r-agent:ro
    restart: unless-stopped

  # emp3r0r C2 sidecar（server 模式）。emp3r0r v5 的 operator API 绑定在
  # userspace WireGuard netstack 上：ARTEX 以 provisioning 的 operator WG
  # 凭据接入 cc overlay（凭据见容器内 ~/.emp3r0r/wg_config.json）。
  # 首次启动生成 wg_config.json；artex 侧 config.emp3r0r 从中取：
  #   wg_endpoint        = 本服务 UDP 端口（EMP3R0R_WG_PORT）
  #   wg_server_public_key / wg_server_ip = wg_config.json server 段
  #   wg_operator_ip / wg_operator_key    = wg_config.json operators.artex
  #   operator_port      = wg_endpoint 端口 + 1（HTTP 监听在 WG IP 上）
  emp3r0r:
    # 上游 release 无二进制资产（release-please 只发 tag）：从 pinned tag 源码
    # 构建最小集（Dockerfile.emp3r0r；EMP3R0R_VERSION 锁 tag，EMP3R0R_COMMIT 可选锁 commit）。
    build:
      context: .
      dockerfile: Dockerfile.emp3r0r
      args:
        EMP3R0R_VERSION: ${EMP3R0R_VERSION:-v5.12.0}
        EMP3R0R_COMMIT: ${EMP3R0R_COMMIT:-}
    image: artex-emp3r0r:${EMP3R0R_VERSION:-v5.12.0}
    profiles: ["emp3r0r"]
    # --operator-port 是 WG UDP 监听口（operator HTTP 在其 +1）。
    # --operators 仅首次 provisioning 可用——已有 wg_config.json 时上游拒绝
    # 重复设置（restart 复跑必须不传）；--http-port 钉住 agent 回连口。
    command: >
      sh -c 'args="--operator-port ${EMP3R0R_WG_PORT:-13377} --http-port ${EMP3R0R_HTTP_PORT:-13380} --h2-port ${EMP3R0R_H2_PORT:-13381}";
             if [ -n "${EMP3R0R_C2_HOSTS:-}" ]; then args="$$args --c2-hosts ${EMP3R0R_C2_HOSTS}"; fi;
             if [ ! -f /root/.emp3r0r/wg_config.json ]; then args="$$args --operators ${EMP3R0R_OPERATORS:-artex}"; fi;
             exec emp3r0r server $$args'
    environment:
      HOME: /root
    volumes:
      - ./data/emp3r0r:/root/.emp3r0r
    ports:
      - "${EMP3R0R_WG_PORT:-13377}:${EMP3R0R_WG_PORT:-13377}/udp"
      # agent 回连端口（http_poll plain / TLS h2conn），对靶标可达
      - "${EMP3R0R_HTTP_PORT:-13380}:${EMP3R0R_HTTP_PORT:-13380}"
      - "${EMP3R0R_H2_PORT:-13381}:${EMP3R0R_H2_PORT:-13381}"
    restart: unless-stopped

volumes:
  pgdata:
